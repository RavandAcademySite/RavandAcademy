<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravand Language Academy | ساخت کارنامه</title>
<link rel="icon" href="assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <!-- Header -->
  <header class="app-header">
    <img src="assets/icons/logo.png" alt="Ravand" class="logo">
    <div class="header-text">
      <h1>Ravand Language Academy</h1>
      <span>سامانه ساخت کارنامه دانش‌آموزان</span>
    </div>
  </header>

  <!-- Step 1: انتخاب قالب -->
  <section class="card">
    <div class="card-title">
      <span class="icon">🎨</span>
      <h2>انتخاب قالب کارنامه</h2>
    </div>
    <p class="card-sub">یکی از قالب‌های زیر را انتخاب کنید.</p>

    <div class="template-grid" id="templateGrid">
      <!-- با جاوااسکریپت پر می‌شود -->
    </div>
  </section>

  <!-- Step 2: فرم اطلاعات (داینامیک بر اساس قالب انتخاب‌شده) -->
  <section class="card" id="formSection" style="display:none;">
    <div class="card-title">
      <span class="icon">📝</span>
      <h2>اطلاعات کارنامه</h2>
    </div>
    <form id="certForm" class="cert-form"></form>
  </section>

  <!-- Step 3: پیش‌نمایش -->
  <section class="card" id="previewSection" style="display:none;">
    <div class="card-title">
      <span class="icon">👁️</span>
      <h2>پیش‌نمایش کارنامه</h2>
    </div>

    <div class="preview-wrapper">
      <div id="certPreview" class="cert-preview"></div>
    </div>

    <div class="download-buttons">
      <button id="downloadPngBtn" class="btn btn-outline">دانلود PNG</button>
      <button id="downloadPdfBtn" class="btn btn-primary">دانلود PDF</button>
    </div>
  </section>

  <footer class="app-footer">
    <span>© Ravand Language Academy</span>
  </footer>
</div>

<!-- کتابخانه‌های خروجی گرفتن از تصویر -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="js/templates.js"></script>
<script src="js/app.js"></script>
</body>
</html>
